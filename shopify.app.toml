# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2cff1a1de2af8b1fa3b51dac62959fa5"
name = "cohesio"
application_url = "https://cohesio-app-amine.azurewebsites.net"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_app_proxy"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[app_proxy]
# /apps/cohesio/<chemin> sur la boutique -> <application_url>/proxy/<chemin>
url = "/proxy"
prefix = "apps"
subpath = "cohesio"


[auth]
redirect_urls = [ "https://cohesio-app-amine.azurewebsites.net/auth/callback" ]

[build]
automatically_update_urls_on_dev = false
